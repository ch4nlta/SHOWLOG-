<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Showlog</title>
<meta name="theme-color" content="#14181c">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<meta name="apple-mobile-web-app-title" content="Showlog">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" type="image/png" href="icon-192.png">
<style>
*{box-sizing:border-box}
html,body{margin:0;background:#14181c;color:#9ab;font:15px/1.5 system-ui,-apple-system,'Segoe UI',sans-serif;-webkit-font-smoothing:antialiased}
body{min-height:100vh;min-height:100dvh;display:grid;place-items:center;padding:calc(24px + env(safe-area-inset-top,0px)) 20px calc(24px + env(safe-area-inset-bottom,0px))}
.card{width:min(360px,100%)}
.logo{display:flex;align-items:center;gap:10px;color:#fff;font-weight:700;font-size:26px;letter-spacing:-.02em;margin-bottom:22px}
.logo i{width:32px;height:32px;border-radius:9px;background:linear-gradient(135deg,#00e054 0 50%,#ff8000 50% 100%);display:grid;place-items:center}
.logo i::after{content:"";border-left:11px solid #14181c;border-top:7px solid transparent;border-bottom:7px solid transparent;margin-left:3px}
h1{margin:0 0 4px;color:#fff;font-size:20px}
p{margin:0 0 16px;color:#8899aa}
label.f{display:block;font-size:11px;text-transform:uppercase;letter-spacing:.09em;color:#8899aa;margin-bottom:4px}
.field{position:relative}
input[type=password],input[type=text]{width:100%;background:#2c3440;color:#fff;border:1px solid #445566;border-radius:4px;padding:11px 64px 11px 12px;font:inherit;font-size:16px}
input:focus-visible,button:focus-visible{outline:2px solid #40bcf4;outline-offset:2px}
.show{position:absolute;right:6px;top:50%;transform:translateY(-50%);background:none;border:0;color:#8899aa;font:inherit;font-size:13px;padding:6px 8px;cursor:pointer}
.chk{display:flex;gap:8px;align-items:center;margin:14px 0;color:#bcd;font-size:14px}
.chk input{accent-color:#00e054;width:18px;height:18px}
.go{width:100%;background:#00e054;color:#041;border:0;border-radius:4px;padding:11px;font:inherit;font-weight:700;font-size:14px;letter-spacing:.06em;text-transform:uppercase;cursor:pointer}
.go:hover{background:#2cf075}
.go:disabled{opacity:.6;cursor:wait}
#err{min-height:22px;margin:10px 0 0;color:#ff8a8a;font-size:14px}
.note{font-size:12px;color:#667788;margin-top:18px}
</style>
</head>
<body>
<main class="card" id="gate" hidden>
  <div class="logo"><i></i>showlog</div>
  <h1>Enter your password</h1>
  <p>This app is private.</p>
  <form id="f" autocomplete="on">
    <label class="f" for="pw">Password</label>
    <div class="field">
      <input type="password" id="pw" name="password" autocomplete="current-password" autocapitalize="off" autocorrect="off" spellcheck="false" required>
      <button type="button" class="show" id="show" aria-label="Show password">Show</button>
    </div>
    <label class="chk"><input type="checkbox" id="keep" checked> Keep me unlocked on this device</label>
    <button class="go" id="go" type="submit">Unlock</button>
    <div id="err" role="alert"></div>
  </form>
  <div class="note">Your diary and settings stay on this device.</div>
</main>

function idb(){return new Promise(function(res,rej){
  var r=indexedDB.open('showlog-lock',1);
  r.onupgradeneeded=function(){r.result.createObjectStore('k')};
  r.onsuccess=function(){res(r.result)};r.onerror=function(){rej(r.error)};
})}
function idbGet(){return idb().then(function(db){return new Promise(function(res,rej){
  var q=db.transaction('k').objectStore('k').get('ck');
  q.onsuccess=function(){db.close();res(q.result)};q.onerror=function(){db.close();rej(q.error)};
})})}
function idbSet(v){return idb().then(function(db){return new Promise(function(res,rej){
  var t=db.transaction('k','readwrite');t.objectStore('k').put(v,'ck');
  t.oncomplete=function(){db.close();res()};t.onerror=function(){db.close();rej(t.error)};
})})}
function idbDel(){return new Promise(function(res){
  try{var r=indexedDB.deleteDatabase('showlog-lock');r.onsuccess=r.onerror=r.onblocked=function(){res()}}catch(e){res()}
})}

function launch(ck){
  return subtle.decrypt({name:'AES-GCM',iv:b64(CFG.iv)},ck,b64(CFG.ct)).then(function(buf){
    var html=new TextDecoder().decode(buf);
    document.open();document.write(html);document.close();
  });
}

function showGate(msg){
  gate.hidden=false;
  if(msg)err.textContent=msg;
  setTimeout(function(){try{pw.focus()}catch(e){}},50);
}

showBtn.addEventListener('click',function(){
  var on=pw.type==='password';
  pw.type=on?'text':'password';showBtn.textContent=on?'Hide':'Show';
});

form.addEventListener('submit',function(e){
  e.preventDefault();
  if(!subtle){err.textContent='Unlocking needs a secure (https) connection.';return}
  var p=pw.value.trim();if(!p)return;
  btn.disabled=true;btn.textContent='Unlocking…';err.textContent='';
  var enc=new TextEncoder();
  subtle.importKey('raw',enc.encode(p),'PBKDF2',false,['deriveKey']).then(function(bk){
    return subtle.deriveKey({name:'PBKDF2',salt:b64(CFG.salt),iterations:CFG.it,hash:'SHA-256'},bk,{name:'AES-GCM',length:256},false,['unwrapKey']);
  }).then(function(kek){
    var i=0;
    function next(){
      if(i>=CFG.w.length)return Promise.reject(new Error('bad'));
      var w=CFG.w[i++];
      return subtle.unwrapKey('raw',b64(w.k),kek,{name:'AES-GCM',iv:b64(w.iv)},{name:'AES-GCM'},false,['decrypt']).catch(next);
    }
    return next();
  }).then(function(ck){
    var saved=keep.checked?idbSet(ck).catch(function(){}):idbDel();
    return saved.then(function(){return launch(ck)});
  }).catch(function(){
    err.textContent='That password isn’t right.';
    btn.disabled=false;btn.textContent='Unlock';
    try{pw.select()}catch(e2){}
  });
});

if(!subtle){showGate('Unlocking needs a secure (https) connection.')}
else{
  idbGet().then(function(k){if(!k)throw new Error('none');return launch(k)})
    .catch(function(){return idbDel().then(function(){showGate()})});
}
})();
</script>
